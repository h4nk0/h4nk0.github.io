<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Capture</title>
  <style>
    :root { --ink: #24476B; --text: #1C1C1E; --muted: #6E6E73; --bg: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #9CB8D9; --text: #F2F2F7; --muted: #A1A1A6; --bg: #000000; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body {
      display: flex; align-items: center; justify-content: center;
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      padding: 0 16px; text-align: center;
    }
    svg { width: 44px; height: 44px; margin-bottom: 16px; color: var(--ink); }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
    p { margin: 0; color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <!-- The Loop: a ring with a small gap. -->
    <svg viewBox="0 0 44 44" aria-hidden="true">
      <path d="M22 4 A18 18 0 1 1 9.27 9.27" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <h1>Returning to Capture…</h1>
    <p>If nothing happens, switch back to Capture.</p>
  </main>
</body>
</html>
